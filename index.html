<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIPINTAR — Sistem Peminjaman Laptop Sekolah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Lucide Icons for modern UI -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --navy:#0f1d36;
  --navy2:#1b2d4f;
  --navy3:#2b4370;

  --cream:#f8f6f0;
  --white:#ffffff;
  --border:#e2dcd0;
  --border2:#c6bfae;

  --orange:#c25e29;
  --orange2:#9c481c;

  --green:#2e6f40;
  --green-bg:#e4f1e8;

  --red:#b92f2f;
  --red-bg:#fde8e8;

  --yellow:#a67c1e;
  --yellow-bg:#fef3db;

  --blue:#2b5e9e;
  --blue-bg:#e5effc;

  --text:#1f1c16;
  --muted:#696255;

  --shadow:0 10px 30px -5px rgba(29,42,68,0.06), 0 4px 6px -2px rgba(29,42,68,0.03);
  --radius:10px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--cream);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

h1,h2,h3{
  font-family:'Source Serif 4',serif;
}

.kode{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  background:#f0ece1;
  padding:2px 6px;
  border-radius:4px;
}

/* ================= APP ================= */

#app{
  min-height:100vh;
}

/* ================= LOGIN ================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 15% 15%,rgba(43,94,158,.15),transparent 40%),
    radial-gradient(circle at 85% 85%,rgba(194,94,41,.15),transparent 40%),
    var(--cream);
}

.login-container{
  width:100%;
  max-width:980px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 25px 65px rgba(15,29,54,.15);
}

.login-info{
  background:var(--navy);
  color:white;
  padding:50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
}

.login-logo{
  width:60px;
  height:60px;
  background:var(--orange);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Source Serif 4',serif;
  font-size:28px;
  font-weight:700;
  margin-bottom:22px;
  box-shadow:0 8px 20px rgba(194,94,41,.35);
}

.login-info h1{
  margin:0 0 10px;
  font-size:36px;
  letter-spacing:-0.5px;
}

.login-info p{
  color:#cbd5e8;
  max-width:420px;
  font-size:13.5px;
  line-height:1.7;
}


.login-feature{
  display:flex;
  gap:12px;
  align-items:center;
  color:#e2e8f0;
  font-size:13px;
}

.login-feature span{
  width:26px;
  height:26px;
  border-radius:8px;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--orange);
  font-weight:bold;
}

.login-form{
  padding:45px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.login-form h2{
  margin:0 0 4px;
  color:var(--navy);
  font-size:24px;
}

.login-sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:24px;
}

.role-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:22px;
}

.role-tab{
  border:1px solid var(--border);
  background:var(--cream);
  padding:10px 8px;
  border-radius:8px;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  text-align:center;
  transition:all .18s;
}

.role-tab:hover{
  border-color:var(--navy3);
  color:var(--navy);
}

.role-tab.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  box-shadow:0 4px 12px rgba(15,29,54,.2);
}

.demo-box{
  margin-top:20px;
  padding:14px;
  background:#f3efe5;
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

/* ================= FORM ================= */

.form-row{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:14px;
}

.form-row label{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border2);
  border-radius:8px;
  padding:10px 12px;
  background:white;
  color:var(--text);
  font-size:13px;
  transition:all .15s;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(43,94,158,.14);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

/* ================= BUTTON ================= */

.btn{
  border:1px solid var(--border2);
  background:white;
  color:var(--navy);
  padding:8px 14px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
  justify-content:center;
}

.btn:hover{
  border-color:var(--navy);
  transform:translateY(-1px);
  background:#fdfcf9;
}

.btn-primary{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
}

.btn-primary:hover{
  background:var(--orange2);
  border-color:var(--orange2);
}

.btn-danger{
  color:var(--red);
  background:var(--red-bg);
  border-color:transparent;
}

.btn-danger:hover{
  background:#f8d1d1;
}

.btn-success{
  color:var(--green);
  background:var(--green-bg);
  border-color:transparent;
}

.btn-success:hover{
  background:#d0e6d6;
}

.btn-sm{
  padding:6px 10px;
  font-size:11.5px;
}

/* ================= LAYOUT ================= */

.app-layout{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:255px;
  flex-shrink:0;
  background:var(--navy);
  color:white;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid rgba(255,255,255,.05);
}

.brand{
  padding:24px 22px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-title{
  font-family:'Source Serif 4',serif;
  font-size:22px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

.brand-sub{
  color:#94a3b8;
  font-size:11px;
  margin-top:3px;
}

.sidebar nav{
  padding:15px 12px;
  flex:1;
  overflow-y:auto;
}

.nav-section{
  color:#64748b;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:12px 10px 6px;
  font-weight:600;
}

.navlink{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  margin:4px 0;
  border-radius:8px;
  color:#cbd5e1;
  text-decoration:none;
  cursor:pointer;
  font-size:12.5px;
  font-weight:500;
  transition:all .15s;
}

.navlink:hover{
  background:rgba(255,255,255,.07);
  color:white;
}

.navlink.active{
  background:var(--orange);
  color:white;
  box-shadow:0 4px 12px rgba(194,94,41,.3);
}

.nav-icon{
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.15);
}

.user-box{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--orange);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  color:white;
  box-shadow:0 4px 10px rgba(194,94,41,.3);
}

.user-name{
  font-size:12.5px;
  font-weight:600;
}

.user-role{
  color:#94a3b8;
  font-size:11px;
  text-transform:capitalize;
}

.logout{
  margin-top:10px;
  width:100%;
  border:0;
  background:rgba(239,68,68,.12);
  color:#f87171;
  cursor:pointer;
  font-size:12px;
  padding:7px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:500;
  transition:all .15s;
}

.logout:hover{
  background:rgba(239,68,68,.22);
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  background:white;
  border-bottom:1px solid var(--border);
  padding:18px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.topbar h1{
  margin:0;
  font-size:22px;
  color:var(--navy);
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.reset-data-btn{
  font-size:11.5px;
  background:#fef2f2;
  color:#dc2626;
  border:1px solid #fecaca;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.reset-data-btn:hover{
  background:#fee2e2;
}

.content{
  padding:28px 32px 64px;
  max-width:1500px;
  width:100%;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:24px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.stat-card:before{
  content:"";
  position:absolute;
  width:4px;
  height:70%;
  left:0;
  top:15%;
  border-radius:0 4px 4px 0;
  background:var(--orange);
}

.stat-title{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

.stat-number{
  font-family:'Source Serif 4',serif;
  color:var(--navy);
  font-size:32px;
  margin-top:4px;
  line-height:1.1;
}

.stat-info{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.stat-icon-wrap{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#f3efe5;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--navy);
}

/* ================= PANEL ================= */

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.panel-head{
  padding:16px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#fcfbf8;
}

.panel-title{
  margin:0;
  color:var(--navy);
  font-family:'Source Serif 4',serif;
  font-size:18px;
}

.panel-sub{
  color:var(--muted);
  font-size:11.5px;
  margin-top:2px;
}

.panel-body{
  padding:20px 22px;
}

/* ================= TOOLBAR ================= */

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.search-wrap{
  flex:1;
  min-width:220px;
  position:relative;
}

.search-wrap input{
  padding-left:36px;
}

.search-icon{
  position:absolute;
  left:11px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  min-width:680px;
}

th{
  text-align:left;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600;
  border-bottom:1px solid var(--border2);
  padding:11px 12px;
  background:#f8f6f0;
  white-space:nowrap;
}

td{
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:none;
}

tbody tr:hover{
  background:#f9f7f2;
}

/* ================= BADGE ================= */

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}

.badge-ok{
  background:var(--green-bg);
  color:var(--green);
}

.badge-wait{
  background:var(--yellow-bg);
  color:var(--yellow);
}

.badge-danger{
  background:var(--red-bg);
  color:var(--red);
}

.badge-blue{
  background:var(--blue-bg);
  color:var(--blue);
}

.badge-neutral{
  background:#ece9e0;
  color:var(--muted);
}

/* ================= EMPTY ================= */

.empty{
  padding:42px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.empty-icon{
  font-size:32px;
  opacity:.5;
  margin-bottom:8px;
}

/* ================= FLASH ================= */

.flash{
  position:fixed;
  right:25px;
  top:25px;
  z-index:1000;
  background:var(--navy);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  box-shadow:0 12px 35px rgba(15,29,54,.25);
  font-size:12.5px;
  display:flex;
  align-items:center;
  gap:10px;
  animation:slideIn .22s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(-12px) scale(0.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ================= WELCOME ================= */

.welcome{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;
  border-radius:12px;
  padding:24px 28px;
  margin-bottom:22px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.welcome h2{
  margin:0 0 4px;
  font-size:24px;
}

.welcome p{
  margin:0;
  color:#cbd5e1;
  font-size:13px;
}

/* ================= QUICK ACTION ================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.quick-card{
  padding:16px;
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  transition:.18s;
  background:white;
}

.quick-card:hover{
  border-color:var(--orange);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.quick-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--blue-bg);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.quick-title{
  color:var(--navy);
  font-weight:700;
  font-size:13px;
}

.quick-desc{
  color:var(--muted);
  font-size:11.5px;
  margin-top:4px;
}

/* ================= NOTE ================= */

.note{
  color:var(--muted);
  font-size:11.5px;
  margin-top:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1050px){
  .sidebar{
    width:210px;
  }
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){
  .login-container{
    grid-template-columns:1fr;
    max-width:520px;
  }
  .login-info{
    display:none;
  }
  .login-form{
    padding:32px;
  }
  .sidebar{
    width:70px;
  }
  .brand-title span{
    display:none;
  }
  .brand-sub,
  .navlink span,
  .nav-section,
  .user-name,
  .user-role,
  .logout span{
    display:none;
  }
  .brand{
    text-align:center;
    padding:20px 8px;
  }
  .navlink{
    justify-content:center;
    padding:12px;
  }
  .topbar{
    padding:15px 18px;
  }
  .topbar h1{
    font-size:18px;
  }
  .content{
    padding:18px 15px 45px;
  }
  .form-grid{
    grid-template-columns:1fr;
  }
  .quick-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

    }

};

const defaultSeq = {
  pj: 2,
  d: 2,
  r: 2,
  laptop: 6,
  siswa: 4,
  petugas: 3
};

function loadStorage(){
  const savedDb = localStorage.getItem(STORAGE_KEY);
  const savedSeq = localStorage.getItem(SEQ_KEY);
  if(savedDb){
    try{ db = JSON.parse(savedDb); }catch(e){ db = JSON.parse(JSON.stringify(defaultDb)); }
  } else {
    db = JSON.parse(JSON.stringify(defaultDb));
  }
  if(savedSeq){
    try{ seq = JSON.parse(savedSeq); }catch(e){ seq = JSON.parse(JSON.stringify(defaultSeq)); }
  } else {
    seq = JSON.parse(JSON.stringify(defaultSeq));
  }
}

function saveStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  localStorage.setItem(SEQ_KEY, JSON.stringify(seq));
}

function resetAllData(){
  if(confirm('Apakah Anda yakin ingin mereset seluruh data SIPINTAR ke pengaturan awal?')){
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SEQ_KEY);
    loadStorage();
    showFlash('Data berhasil di-reset ke pengaturan awal.');
    render();
  }
}

const escapeHtml = text =>
  String(text ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

function showFlash(message, type='navy'){
  clearTimeout(flashTimer);
  const old = document.querySelector('.flash');
  if(old) old.remove();

  const div = document.createElement('div');
  div.className = 'flash';
  div.innerHTML = `<i data-lucide="check-circle-2" style="width:18px;height:18px;"></i> <span>${escapeHtml(message)}</span>`;
  document.body.appendChild(div);
  if(window.lucide) lucide.createIcons();

  flashTimer = setTimeout(()=>{
    div.remove();
  },2800);
}

function statusBadge(status){
  const map = {
    'Tersedia':'badge-ok',
    'Dipinjam':'badge-wait',
    'Menunggu':'badge-wait',
    'Menunggu Konfirmasi':'badge-wait',
    'Perbaikan':'badge-danger',
    'Hilang':'badge-danger',
    'Selesai':'badge-ok',
    'Ditolak':'badge-danger'
  };
  return `
    <span class="badge ${map[status] || 'badge-neutral'}">
      ${escapeHtml(status)}
    </span>
  `;
}

function showLaptopForm(existing=null){
  const wrap = $('#laptopFormWrap');
  wrap.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2 class="panel-title">${existing ? 'Ubah Laptop' : 'Tambah Laptop'}</h2>
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="form-row">
            <label>Kode Laptop</label>
            <input id="fKode" value="${existing ? escapeHtml(existing.kode_laptop) : ''}" placeholder="LT-006">
          </div>
          <div class="form-row">
            <label>Merk</label>
            <input id="fMerk" value="${existing ? escapeHtml(existing.merk) : ''}" placeholder="Lenovo">
          </div>
          <div class="form-row">
            <label>Tipe</label>
            <input id="fTipe" value="${existing ? escapeHtml(existing.tipe) : ''}" placeholder="ThinkPad E14">
          </div>
          <div class="form-row">
            <label>Kondisi</label>
            <select id="fKondisi">
              ${['Baik','Rusak Ringan','Rusak Berat'].map(x=>`
                <option ${existing && existing.kondisi===x?'selected':''}>${x}</option>
              `).join('')}
            </select>
          </div>
          <div class="form-row">
            <label>Status</label>
            <select id="fStatus">
              ${['Tersedia','Dipinjam','Perbaikan','Hilang'].map(x=>`
                <option ${existing && existing.status===x?'selected':''}>${x}</option>
              `).join('')}
            </select>
          </div>
        </div>
        <button class="btn btn-primary" id="saveLaptopBtn">Simpan</button>
        <button class="btn" id="cancelLaptopBtn">Batal</button>
      </div>
    </div>
  `;

  $('#cancelLaptopBtn').onclick = ()=> wrap.innerHTML = '';
  $('#saveLaptopBtn').onclick = ()=>{
    const kode = $('#fKode').value.trim();
    const merk = $('#fMerk').value.trim();
    const tipe = $('#fTipe').value.trim();

    if(!kode || !merk || !tipe){
      showFlash('Kode, merk, dan tipe wajib diisi.');
      return;
    }

    const duplicate = db.laptop.some(
      x => x.kode_laptop.toLowerCase() === kode.toLowerCase() &&
           (!existing || x.id_laptop !== existing.id_laptop)
    );

    if(duplicate){
      showFlash('Kode laptop sudah digunakan.');
      return;
    }

    if(existing){
      Object.assign(existing, {
        kode_laptop: kode,
        merk,
        tipe,
        kondisi: $('#fKondisi').value,
        status: $('#fStatus').value
      });
      showFlash('Data laptop berhasil diperbarui.');
    } else {
      db.laptop.push({
        id_laptop: 'L' + String(seq.laptop++).padStart(2,'0'),
        kode_laptop: kode,
        merk,
        tipe,
        kondisi: $('#fKondisi').value,
        status: $('#fStatus').value
      });
      showFlash('Laptop baru berhasil ditambahkan.');
    }
    saveStorage();
    wrap.innerHTML = '';
    render();
  };
}

function renderPeminjamanTable(list, opts={}){
  if(!list.length){
    return `
      <div class="empty">
        <div class="empty-icon">◷</div>
        Belum ada data peminjaman.
      </div>
    `;
  }

  const rows = list.map(p=>{
    const laptops = db.detail_peminjaman
      .filter(d=>d.id_peminjaman===p.id_peminjaman)
      .map(d=>findLaptop(d.id_laptop)?.kode_laptop)
      .filter(Boolean)
      .join(', ');

    const canProcess =
      (session.role==='admin' || session.role==='petugas') &&
      p.status==='Menunggu';

    const canReturn =
      (session.role==='admin' || session.role==='petugas') &&
      p.status==='Dipinjam';

    return `
      <tr>
        <td class="kode">${escapeHtml(p.id_peminjaman)}</td>
        ${opts.siswaCol===false ? '' : `<td><b>${escapeHtml(findSiswa(p.id_siswa)?.nama_siswa || '-')}</b></td>`}
        <td><span class="kode">${escapeHtml(laptops || '-')}</span></td>
        <td>${escapeHtml(p.tanggal_pinjam)}</td>
        <td>${escapeHtml(p.tanggal_kembali_rencana || '-')}</td>
        <td>${statusBadge(p.status)}</td>
        <td>
          ${
            canProcess
            ? `
              <button class="btn btn-sm btn-success" data-approve="${p.id_peminjaman}">Setujui</button>
              <button class="btn btn-sm btn-danger" data-reject="${p.id_peminjaman}">Tolak</button>
            `
            : ''
          }
          ${
            canReturn
            ? `
              <button class="btn btn-sm btn-primary" data-return="${p.id_peminjaman}">Pengembalian</button>
            `
            : ''
          }
        </td>
      </tr>
    `;
  }).join('');

  return `
    <table>
      <thead>
        <tr>
          <th>ID</th>
          ${opts.siswaCol===false ? '' : '<th>Siswa</th>'}
          <th>Laptop</th>
          <th>Tgl Pinjam</th>
          <th>Rencana Kembali</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function bindPeminjamanActions(){
  document.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = findPeminjaman(btn.dataset.approve);
      if(!p) return;
      const details = db.detail_peminjaman.filter(d=>d.id_peminjaman===p.id_peminjaman);
      const unavailable = details.some(d=>{
        const laptop = findLaptop(d.id_laptop);
        return !laptop || laptop.status!=='Menunggu Konfirmasi';
      });

      if(unavailable){
        showFlash('Laptop sudah tidak tersedia.');
        return;
      }

      p.status='Dipinjam';
      details.forEach(d=>{
        const laptop = findLaptop(d.id_laptop);
        if(laptop) laptop.status='Dipinjam';
      });

      saveStorage();
      showFlash('Peminjaman berhasil disetujui.');
      render();
    };
  });

  document.querySelectorAll('[data-reject]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = findPeminjaman(btn.dataset.reject);
      if(!p) return;
      p.status='Ditolak';
      db.detail_peminjaman.filter(d=>d.id_peminjaman===p.id_peminjaman).forEach(d=>{
        const laptop = findLaptop(d.id_laptop);
        if(laptop && laptop.status==='Menunggu Konfirmasi'){
          laptop.status='Tersedia';
        }
      });
      saveStorage();
      showFlash('Pengajuan peminjaman ditolak.');
      render();
    };
  });

  document.querySelectorAll('[data-return]').forEach(btn=>{
    btn.onclick = ()=> showReturnForm(btn.dataset.return);
  });
}

function showReturnForm(id){
  const p = findPeminjaman(id);
  const details = db.detail_peminjaman.filter(d=>d.id_peminjaman===id);
  const wrap = $('#returnFormWrap');

  wrap.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Proses Pengembalian ${escapeHtml(id)}</h2>
      </div>
      <div class="panel-body">
        <div class="note" style="margin-bottom:18px">
          Siswa: <b>${escapeHtml(findSiswa(p.id_siswa)?.nama_siswa || '-')}</b>
          &nbsp; • &nbsp;
          Laptop: <b>${details.map(d=>findLaptop(d.id_laptop)?.kode_laptop).join(', ')}</b>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label>Kondisi Saat Kembali</label>
            <select id="fKondisiKembali">
              <option>Baik</option>
              <option>Rusak Ringan</option>
              <option>Rusak Berat</option>
              <option>Hilang</option>
            </select>
          </div>
          <div class="form-row">
            <label>Tanggal Pengembalian</label>
            <input id="fTglKembali" type="date" value="${todayStr()}">
          </div>
        </div>

        <div class="form-row">
          <label>Keterangan</label>
          <textarea id="fKeterangan" rows="3" placeholder="Contoh: Charger lengkap, kondisi normal."></textarea>
        </div>

        <button class="btn btn-primary" id="saveReturnBtn">Simpan Pengembalian</button>
        <button class="btn" id="cancelReturnBtn">Batal</button>
      </div>
    </div>
  `;

  $('#cancelReturnBtn').onclick = ()=> wrap.innerHTML='';
  $('#saveReturnBtn').onclick = ()=>{
    const tanggal = $('#fTglKembali').value;
    if(!tanggal){
      showFlash('Tanggal pengembalian wajib diisi.');
      return;
    }
    const kondisi = $('#fKondisiKembali').value;

    db.pengembalian.push({
      id_pengembalian: 'R' + String(seq.r++).padStart(2,'0'),
      id_peminjaman: id,
      id_petugas: session.role==='petugas' ? session.id : (db.petugas[0]?.id_petugas || 'P01'),
      tanggal_pengembalian: tanggal,
      kondisi_kembali: kondisi,
      keterangan: $('#fKeterangan').value.trim()
    });

    p.status='Selesai';
    details.forEach(d=>{
      const laptop = findLaptop(d.id_laptop);
      if(!laptop) return;
      if(kondisi==='Baik'){
        laptop.status='Tersedia';
        laptop.kondisi='Baik';
      } else if(kondisi==='Hilang'){
        laptop.status='Hilang';
        laptop.kondisi='Hilang';
      } else {
        laptop.status='Perbaikan';
        laptop.kondisi=kondisi;
      }
    });

    saveStorage();
    showFlash('Pengembalian berhasil dicatat.');
    render();
  };
}

  `, 'Ajukan Peminjaman', 'Form Pengajuan Laptop');

  const btn = $('#ajukanBtn');
  if(!btn) return;

  btn.onclick = ()=>{
    const idLaptop = $('#fLaptop').value;
    const rencana = $('#fRencana').value;

    if(!rencana){
      showFlash('Rencana tanggal kembali wajib diisi.');
      return;
    }
    if(rencana < todayStr()){
      showFlash('Tanggal kembali tidak boleh sebelum hari ini.');
      return;
    }

    const laptop = findLaptop(idLaptop);
    if(!laptop || laptop.status!=='Tersedia'){
      showFlash('Laptop tersebut sudah tidak tersedia.');
      render();
      return;
    }

    const id = 'PJ' + String(seq.pj++).padStart(2,'0');

    db.peminjaman.push({
      id_peminjaman: id,
      id_siswa: session.id,
      id_admin: db.admin[0]?.id_admin || 'A01',
      tanggal_pinjam: todayStr(),
      tanggal_kembali_rencana: rencana,
      status: 'Menunggu'
    });

    db.detail_peminjaman.push({
      id_detail: 'D' + String(seq.d++).padStart(2,'0'),
      id_peminjaman: id,
      id_laptop: idLaptop,
      kondisi_pinjam: laptop.kondisi
    });

    laptop.status = 'Menunggu Konfirmasi';
    saveStorage();
    showFlash('Pengajuan berhasil dikirim.');
    currentPage = 'riwayat';
    render();
  };
}

/* =========================================================
   RIWAYAT SISWA
========================================================= */

function renderRiwayatPage(){
  const my = db.peminjaman
    .filter(p=>p.id_siswa===session.id)
    .slice()
    .reverse();

  renderShell(`
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Riwayat Peminjaman Saya</h2>
          <div class="panel-sub">Semua pengajuan peminjaman yang pernah kamu lakukan</div>
        </div>
      </div>
      <div class="table-wrap">
        ${renderPeminjamanTable(my, {siswaCol:false})}
      </div>
    </div>
  `, 'Riwayat Saya', 'Riwayat Pengajuan Peminjaman');
}

/* =========================================================
   ROUTER UTAMA
========================================================= */

function render(){
  if(!session){
    renderLogin();
    return;
  }

  const pages = {
    dashboard: renderDashboard,
    laptop: renderLaptopPage,
    siswa: renderSiswaPage,
    petugas: renderPetugasPage,
    peminjaman: renderPeminjamanPage,
    pengembalian: renderPengembalianPage,
    ajukan: renderAjukanPage,
    riwayat: renderRiwayatPage
  };

  const page = pages[currentPage] || renderDashboard;
  page();
}

render();
</script>

</body>
</html>
